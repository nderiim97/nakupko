# Render blueprint for the Nakupko store.
# 1. Push this repository to GitHub.
# 2. In Render: New > Blueprint > select the repository.
# 3. Fill in the secret values marked "sync: false".
services:
  - type: web
    name: nakupko
    runtime: python
    plan: starter
    buildCommand: pip install -r server/requirements.txt
    startCommand: uvicorn server.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: nakupko-db
          property: connectionString
      - key: PUBLIC_BASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STORE_NAME
        value: Nakupko
      - key: STORE_EMAIL
        sync: false
      - key: STORE_PHONE
        sync: false
      - key: STORE_ADDRESS
        sync: false
      - key: STORE_VAT
        sync: false
      - key: STORE_IBAN
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_TLS
        value: "true"

databases:
  - name: nakupko-db
    plan: starter
    databaseName: nakupko
    user: nakupko
